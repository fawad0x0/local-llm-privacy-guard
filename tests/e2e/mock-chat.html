<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock chat</title>
    <style>
      body {
        font:
          14px system-ui,
          sans-serif;
        margin: 20px;
      }
      .editor {
        min-height: 40px;
        border: 1px solid #999;
        padding: 6px;
        white-space: pre-wrap;
      }
      textarea {
        width: 100%;
        min-height: 40px;
      }
    </style>
  </head>
  <body>
    <!-- Mimics a chat composer: contenteditable (ChatGPT-like) or textarea, a send button and a file input. -->
    <form id="composer" onsubmit="return false;">
      <div id="prompt-textarea" class="editor" contenteditable="true"></div>
      <textarea id="plain" hidden></textarea>
      <input type="file" id="file" multiple />
      <button type="button" data-testid="send-button" id="send">Send</button>
    </form>
    <h3>Sent</h3>
    <ul id="log"></ul>
    <h3>Uploaded</h3>
    <ul id="files"></ul>
    <h3>Assistant</h3>
    <div id="reply"></div>
    <script>
      const mode = new URLSearchParams(location.search).get("mode") || "rich";
      const rich = document.getElementById("prompt-textarea");
      const plain = document.getElementById("plain");
      if (mode === "textarea") {
        rich.remove();
        plain.hidden = false;
      }
      const editor = mode === "textarea" ? plain : rich;
      const read = () => (mode === "textarea" ? plain.value : rich.innerText).trim();
      const clear = () => (mode === "textarea" ? (plain.value = "") : (rich.textContent = ""));

      function send() {
        const t = read();
        if (!t) return;
        const li = document.createElement("li");
        li.textContent = t;
        document.getElementById("log").append(li);
        clear();
        // The "assistant" echoes the message back, the way models repeat placeholders.
        document.getElementById("reply").textContent = "You said: " + t;
      }
      document.getElementById("send").addEventListener("click", send);
      editor.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      document.getElementById("file").addEventListener("change", async e => {
        for (const f of e.target.files) {
          const li = document.createElement("li");
          li.textContent = f.name + " => " + (await f.text());
          document.getElementById("files").append(li);
        }
      });
    </script>
  </body>
</html>
